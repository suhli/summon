[package]
name = "summon"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A lightweight Windows 10/11 launcher"
license = "MIT"
publish = false

[dependencies]
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
slint = { version = "1.17.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
